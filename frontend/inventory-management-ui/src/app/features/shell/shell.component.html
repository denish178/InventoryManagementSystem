<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">IMS</span>
      <div>
        <strong>Stockroom</strong>
        <small>Single location</small>
      </div>
    </div>
    <nav>
      @for (link of links(); track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }">
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div>
        <strong>{{ auth.session()?.fullName }}</strong>
        <span class="muted">{{ auth.session()?.roles?.join(', ') }}</span>
      </div>
      <button class="btn ghost" type="button" (click)="logout()">Log out</button>
    </header>
    <router-outlet />
  </div>
</div>
